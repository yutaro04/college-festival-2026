<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜まぜまぜ。カレッジ文化祭 2026</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Zen+Old+Mincho:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* キービジュアル由来の配色（assets/css/style.css と揃えています） */
    --grad: linear-gradient(100deg, #9e2a10, #f4492f 34%, #f59b3f 70%, #f8c070);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 8px;
    padding: 40px 24px;
    text-align: center;
    background: #fdf8f1;
    color: #1a120c;
    font-family: "FOT-TsukuAOldMin Pr6N", "Tsukushi A Old Mincho", "Zen Old Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 500;
    line-height: 1.9;
  }
  .kv { width: min(42vw, 190px); margin-bottom: 8px; }
  .code {
    font-family: "Outfit", sans-serif;
    font-size: clamp(4rem, 18vw, 8.5rem);
    font-weight: 900;
    line-height: 1;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 { font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 900; margin: 12px 0 4px; }
  p { color: #5f4c42; font-size: .9rem; margin: 0; }
  a.home {
    display: inline-block;
    margin-top: 28px;
    padding: 13px 30px;
    border-radius: 999px;
    background: #f4492f;
    color: #fff;
    font-weight: 700;
    font-size: .88rem;
    text-decoration: none;
    transition: background .2s;
  }
  a.home:hover { background: #9e2a10; }
</style>
</head>
<body>
  <img class="kv" src="/assets/img/keyvisual-transparent.png" alt="" aria-hidden="true">
  <p class="code">404</p>
  <h1>ページが見つかりません</h1>
  <p>URL が変更されたか、削除された可能性があります。</p>
  <a class="home" href="/">トップへもどる</a>
</body>
</html>
