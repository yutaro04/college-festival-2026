<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜まぜまぜ。カレッジ文化祭 2026</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --grad: linear-gradient(100deg, #ff5d8f, #ff9245 28%, #ffc93c 46%, #3fc79a 66%, #3d9df5 84%, #8b6cf0);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 8px;
    padding: 40px 24px;
    text-align: center;
    background: #fbf8f4;
    color: #1c1a2b;
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    font-weight: 500;
    line-height: 1.9;
  }
  .code {
    font-family: "Outfit", sans-serif;
    font-size: clamp(5rem, 22vw, 11rem);
    font-weight: 900;
    line-height: 1;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 { font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 900; margin: 16px 0 4px; }
  p { color: #55516d; font-size: .9rem; margin: 0; }
  a.home {
    display: inline-block;
    margin-top: 28px;
    padding: 13px 30px;
    border-radius: 999px;
    background: #1c1a2b;
    color: #fff;
    font-weight: 700;
    font-size: .88rem;
    text-decoration: none;
    transition: background .2s;
  }
  a.home:hover { background: #8b6cf0; }
</style>
</head>
<body>
  <p class="code">404</p>
  <h1>ページが見つかりません</h1>
  <p>URL が変更されたか、削除された可能性があります。</p>
  <a class="home" href="/">トップへもどる</a>
</body>
</html>
